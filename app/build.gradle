apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

android {
    compileSdkVersion 35
    
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
        buildConfig = true
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

    defaultConfig {
        applicationId "com.shady.neoqn"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 65
        versionName "2.1.5"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        ndk {
            if (!gradle.startParameter.taskNames.any { it.contains("Release") || it.contains("release") }) {
                abiFilters "arm64-v8a"
            }
        }
    }

    signingConfigs {
        release {
            // Read storeFile path and credentials dynamically from environment variable or local.properties
            def storeFilePath = System.getenv("SIGNING_STORE_FILE") ?: ""
            def storePass = System.getenv("SIGNING_STORE_PASSWORD") ?: ""
            def keyAli = System.getenv("SIGNING_KEY_ALIAS") ?: ""
            def keyPass = System.getenv("SIGNING_KEY_PASSWORD") ?: ""
            
            if (project.rootProject.file('local.properties').exists()) {
                Properties properties = new Properties()
                properties.load(project.rootProject.file('local.properties').newDataInputStream())
                if (!storeFilePath) storeFilePath = properties.getProperty('signing.storeFile', "")
                if (!storePass) storePass = properties.getProperty('signing.storePassword', "")
                if (!keyAli) keyAli = properties.getProperty('signing.keyAlias', "")
                if (!keyPass) keyPass = properties.getProperty('signing.keyPassword', "")
            }
            
            storeFile storeFilePath ? file(storeFilePath) : file("release.keystore")
            storePassword storePass ?: "dummy_pass"
            keyAlias keyAli ?: "dummy_alias"
            keyPassword keyPass ?: "dummy_pass"
        }
    }

    splits {
        abi {
            enable gradle.startParameter.taskNames.any { it.contains("Release") || it.contains("release") }
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86_64"
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            buildConfigField("boolean", "BETA", "true")
            versionNameSuffix '-DEBUG'
            debuggable true
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    buildFeatures.buildConfig true

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += [
            "-P",
            "plugin:androidx.compose.compiler.plugins.kotlin:stabilityConfigurationPath=" + project.rootDir.absolutePath + "/compose_compiler_config.conf"
        ]
    }
    namespace 'com.lagradost.quicknovel'




}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar", "*.aar"])
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.7'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.7'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'org.jetbrains.kotlin:kotlin-test:1.9.22'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.17.2"
    implementation "androidx.preference:preference-ktx:1.2.1"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "me.xdrop:fuzzywuzzy:1.4.0"
    implementation 'org.slf4j:slf4j-android:1.7.36'

    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

    implementation "com.google.android.material:material:1.12.0"

    implementation 'androidx.media:media:1.7.0'
    implementation 'com.github.LagradOst:SafeFile:a926e7615a'
    implementation 'com.jaredrummler:colorpicker:1.1.0'
    
    implementation 'com.github.Blatzar:NiceHttp:0.4.11'
    implementation "io.coil-kt.coil3:coil:3.0.4"
    implementation "io.coil-kt.coil3:coil-network-okhttp:3.0.4"
    implementation "io.coil-kt.coil3:coil-compose:3.0.4"
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "com.facebook.shimmer:shimmer:0.5.0"
    implementation "com.google.mlkit:translate:17.0.1"
    implementation "com.google.mlkit:language-id:17.0.6"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1"
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'

    // Room Database for Updates Feed
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation "androidx.dynamicanimation:dynamicanimation:1.0.0"
    implementation 'androidx.palette:palette-ktx:1.0.0'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.activity:activity-compose:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // Profile installer for Baseline Profile support
    implementation 'androidx.profileinstaller:profileinstaller:1.4.0'

    // Local Wi-Fi Sync (Lightweight QR Generator and Google Code Scanner)
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.android.gms:play-services-auth:20.7.0'

    // Jetpack Glance AppWidget Support
    implementation 'androidx.glance:glance-appwidget:1.1.0'
    implementation 'androidx.glance:glance-material3:1.1.0'

}
